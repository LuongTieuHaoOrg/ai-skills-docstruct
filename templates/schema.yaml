# .docstruct/schema.yaml
# Approved documentation structure — generated by /docstruct init.
# Keep this file in sync with the actual folder tree inside docroot.

meta:
  docroot: ""                 # must match project-profile.yaml
  approved_at: ""             # YYYY-MM-DD

structure:
  - folder: 00-common
    purpose: "Glossary, abbreviations, references"
    readme: true
    files:
      - glossary.md
      - abbreviations.md
      - references.md

  - folder: 01-overview
    purpose: "Problem statement, summary, goals, scope"
    readme: true

  - folder: 02-business
    purpose: "Value proposition, market, pricing, risk/legal, SLA"
    readme: true
    files:
      - use-cases/          # End-to-end interaction flows: main path + all alternative/exception paths (business language, no technical detail)

  - folder: 03-features
    purpose: "Detailed feature blocks — user stories with acceptance criteria, one group per feature (audience: developers/testers)"
    readme: true

  - folder: 04-architecture
    purpose: "System overview, components, data flow, API, data model"
    readme: true

  - folder: 05-security
    purpose: "Threat model, defense, compliance, privacy"
    readme: true

  - folder: 06-implementation
    purpose: "Deployment, config, integration, migration"
    readme: true

  - folder: 07-quality
    purpose: "Test strategy, test plans, UAT"
    readme: true

  - folder: 08-operations
    purpose: "Runbook, incident response, DR/BCP"
    readme: true

  - folder: 09-guides
    purpose: "User guide, admin guide, training, FAQ"
    readme: true

  - folder: 10-deliverables
    purpose: "Aggregated documents: BRD, PRD, SAD, FSD..."
    readme: true

  - folder: 99-assets
    purpose: "Images, diagrams, templates"
    readme: false

# Aggregation matrix — single structure
aggregation_matrix:
  BRD: [01-overview, 02-business]
  PRD: [01-overview, 03-features, 02-business, 07-quality]
  SAD: [04-architecture, 05-security, 06-implementation, 07-quality, 08-operations]
  FSD: [03-features, 04-architecture]
  SRD: [05-security, 03-features]
  Proposal: [01-overview, 02-business]
  TestPlan: [07-quality, 03-features, 05-security]
  Runbook: [08-operations, 06-implementation, 04-architecture]
  UserAdminGuide: [09-guides, 03-features, 01-overview]
