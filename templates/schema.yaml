# .docstruct/schema.yaml
# Approved documentation structure — generated by /docstruct init from tier S/M/L.
# Keep this file in sync with the actual folder tree inside docroot.

meta:
  tier: ""                      # S | M | L
  docroot: ""                   # must match project-profile.yaml
  approved_at: ""               # YYYY-MM-DD

structure:
  - folder: 00-common
    purpose: "Glossary, abbreviations, references"
    readme: true
    files:
      - glossary.md
      - abbreviations.md
      - references.md

  - folder: 01-overview
    purpose: "Problem statement, summary, goals, scope"
    readme: true

  - folder: 02-architecture
    purpose: "System overview, components, data flow, API, data model"
    readme: true

  - folder: 03-features
    purpose: "Detailed feature blocks — user stories with acceptance criteria, one group per feature (audience: developers/testers)"
    readme: true

  - folder: 04-security
    purpose: "Threat model, defense, compliance, privacy"
    readme: true

  - folder: 05-implementation-guide
    purpose: "Deployment, config, integration, migration"
    readme: true

  - folder: 06-business-docs
    purpose: "Value proposition, market, pricing, risk/legal, SLA"
    readme: true
    files:
      - use-cases/          # End-to-end interaction flows: main path + all alternative/exception paths (business language, no technical detail)

  - folder: 07-deliverables
    purpose: "Aggregated documents: BRD, PRD, SAD, FSD..."
    readme: true

  - folder: 08-quality-assurance
    purpose: "Test strategy, test plans, UAT"
    readme: true

  - folder: 09-operations
    purpose: "Runbook, incident response, DR/BCP"
    readme: true

  - folder: 10-enablement
    purpose: "User guide, admin guide, training, FAQ"
    readme: true

  - folder: assets
    purpose: "Images, diagrams, templates"
    readme: false

# Aggregation matrix — adjust when a tier removes folders
aggregation_matrix:
  BRD: [01-overview, 06-business-docs]
  PRD: [01-overview, 03-features, 06-business-docs, 08-quality-assurance]
  SAD: [02-architecture, 04-security, 05-implementation-guide, 08-quality-assurance, 09-operations]
  FSD: [03-features, 02-architecture]
  SRD: [04-security, 03-features]
  Proposal: [01-overview, 06-business-docs]
  TestPlan: [08-quality-assurance, 03-features, 04-security]
  Runbook: [09-operations, 05-implementation-guide, 02-architecture]
  UserAdminGuide: [10-enablement, 03-features, 01-overview]

# Tier reduction guidance (reference for /docstruct init)
tier_guidance:
  S:
    keep: [00-common, 01-overview, 02-architecture, 03-features, 07-deliverables]
    optional: [assets]
  M:
    keep: [00-common, 01-overview, 02-architecture, 03-features, 04-security, 05-implementation-guide, 07-deliverables]
    optional: [08-quality-assurance, 09-operations]
