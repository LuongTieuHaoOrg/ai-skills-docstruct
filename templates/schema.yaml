# .docstruct/schema.yaml
# Approved documentation structure — generated by /docstruct init.
# Keep this file in sync with the actual folder tree inside docroot.
# Full standard structure — single, no tier variants.

meta:
  docroot: ""                 # must match project-profile.yaml
  approved_at: ""             # YYYY-MM-DD

structure:
  - folder: 00-common
    purpose: "Glossary, abbreviations, references, conventions, traceability (auto-generated)"
    readme: true
    files:
      - 01-glossary.md
      - 02-abbreviations.md
      - 03-references.md
      - 04-conventions.md
      - 05-traceability.md      # Auto-generated by generate from status: RELEASED + knowledge/_index.md

  - folder: 01-overview
    purpose: "Problem statement, vision, goals, scope, stakeholders, constraints, roadmap"
    readme: true
    files:
      - 01-problem-statement.md
      - 02-vision.md
      - 03-goals.md
      - 04-scope.md
      - 05-stakeholders.md
      - 06-constraints.md
      - 07-roadmap.md           # Simple: Version | Goal/Scope | Target date | Status DRAFT|UPDATING|RELEASED — bugfix not on roadmap

  - folder: 02-business
    purpose: "Value proposition, market, business model, pricing, SLA, risk/legal, use-cases, change requests"
    readme: true
    files:
      - 01-value-proposition.md
      - 02-market-analysis.md
      - 03-business-model.md
      - 04-pricing.md
      - 05-sla.md
      - 06-risk-legal.md
      - use-cases/
      - change-requests/        # Each customer request: CR-YYYYMMDD-HHmmss.md (type: feature|bugfix)

  - folder: 03-features
    purpose: "Detailed feature blocks — user stories with acceptance criteria, one group per feature (audience: developers/testers)"
    readme: true
    files:
      - 01-feature-catalog.md
      - 04-dependencies.md      # Dependency graph between features
      - features/

  - folder: 04-architecture
    purpose: "System overview, components, data flow, API, data model, tech stack, decisions"
    readme: true
    files:
      - 01-system-overview.md
      - 02-components.md
      - 03-data-flow.md
      - 04-api-spec.md
      - 05-data-model.md
      - 06-tech-stack.md
      - 07-decisions-adr.md

  - folder: 05-security
    purpose: "Threat model, defense, compliance, privacy, authz"
    readme: true
    files:
      - 01-threat-model.md
      - 02-defense.md
      - 03-compliance.md
      - 04-privacy.md
      - 05-authz.md

  - folder: 06-implementation
    purpose: "Deployment, config, integration, migration, development guide"
    readme: true
    files:
      - 01-deployment.md
      - 02-configuration.md
      - 03-integration.md
      - 04-migration.md
      - 05-development-guide.md

  - folder: 07-quality
    purpose: "Test strategy, test plans, test cases, UAT, quality metrics"
    readme: true
    files:
      - 01-test-strategy.md
      - 02-test-plan.md
      - 03-test-cases.md
      - 04-uat.md
      - 05-quality-metrics.md

  - folder: 08-operations
    purpose: "Runbook, incident response, DR/BCP, monitoring, support"
    readme: true
    files:
      - 01-runbook.md
      - 02-incident-response.md
      - 03-dr-bcp.md
      - 04-monitoring.md
      - 05-support.md

  - folder: 09-guides
    purpose: "User guide, admin guide, training, FAQ, onboarding"
    readme: true
    files:
      - 01-user-guide.md
      - 02-admin-guide.md
      - 03-training.md
      - 04-faq.md
      - 05-onboarding.md

  - folder: 10-deliverables
    purpose: "Aggregated documents — placeholders with refs (each has distinct headings)"
    readme: true
    files:
      - 01-BRD.md           # Business Requirements — Ref: 01-overview + 02-business
      - 02-PRD.md           # Product Requirements — Ref: 01-overview + 03-features + 02-business + 07-quality
      - 03-SAD.md           # System Architecture — Ref: 04-architecture + 05-security + 06-implementation + 07-quality + 08-operations
      - 04-FSD.md           # Functional Spec — Ref: 03-features + 04-architecture
      - 05-SRD.md           # Security Requirements — Ref: 05-security + 03-features
      - 06-Proposal.md      # Proposal — Ref: 01-overview + 02-business
      - 07-TestPlan.md      # Test Plan — Ref: 07-quality + 03-features + 05-security
      - 08-Runbook.md       # Runbook — Ref: 08-operations + 06-implementation + 04-architecture
      - 09-UserAdminGuide.md # User/Admin Guide — Ref: 09-guides + 03-features + 01-overview

  - folder: 99-assets
    purpose: "Images, diagrams, templates"
    readme: false

# Aggregation matrix — single structure (for reference, generate now targets files directly; deliverables are built from the same matrix)
aggregation_matrix:
  BRD: [01-overview, 02-business]
  PRD: [01-overview, 03-features, 02-business, 07-quality]
  SAD: [04-architecture, 05-security, 06-implementation, 07-quality, 08-operations]
  FSD: [03-features, 04-architecture]
  SRD: [05-security, 03-features]
  Proposal: [01-overview, 02-business]
  TestPlan: [07-quality, 03-features, 05-security]
  Runbook: [08-operations, 06-implementation, 04-architecture]
  UserAdminGuide: [09-guides, 03-features, 01-overview]
