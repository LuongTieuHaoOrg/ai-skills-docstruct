# .docstruct/project-profile.yaml
# Project profile — generated by /docstruct init.
# All other commands (validate / generate) MUST read this file first.

project:
  name: ""                      # Project/solution name
  description: ""               # Short description
  type: ""                      # software | hardware | service | research
  created: ""                   # YYYY-MM-DD

audience:
  primary: []                   # e.g. [engineers, project managers]
  technical_depth: ""           # high-level | balanced | deep-dive

scale:
  tier: ""                      # S | M | L
  rationale: ""                 # Why this tier was chosen (from project scan)

docroot:
  path: ""                      # "docs" or ".docstruct/docs" — chosen by user during init
  note: >-
    All validate / generate operations target this directory.

language:
  response: ""        # Agent reply language: "en" | "vi"
  documentation: ""   # Doc content language: "en" | "vi" | "vi-en" — see definitions below

# Language mode definitions (documentation):
#   en    — pure English.
#   vi    — pure Vietnamese; English kept ONLY for proper nouns / product /
#           technology names with no Vietnamese equivalent (code, Java,
#           PostgreSQL, REST API...). Example: "He thong chay tren PostgreSQL".
#   vi-en — Vietnamese with English gloss in parentheses on FIRST use of each
#           specialized term; register all glossed terms in glossary.md.
#           Example: "Co so du lieu (database) luu tru ho so".
#
# If this block is empty or missing, ASK the user before running any command.

compliance:
  security_requirements: []     # e.g. [GDPR, ISO 27001]
  notes: ""

deliverables:
  target_documents: []          # e.g. [BRD, PRD, SAD]

tech_stack:
  - ""                          # e.g. Next.js, PostgreSQL
